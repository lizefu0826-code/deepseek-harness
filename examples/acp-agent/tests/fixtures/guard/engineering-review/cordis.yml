# Keyless Loader composition for the opt-in core and hardware adapter.
- id: fixture
  name: './fixture.ts'

- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'

- id: fs
  name: '@deepseek-ai/dsh-fs-local'
  config:
    cwd: !!js process.cwd()

- id: subagent
  name: '@deepseek-ai/dsh-subagent'

- id: subagent-spawn
  name: '@deepseek-ai/dsh-subagent-spawn-in-process'
  config:
    providerName: spawn

- id: agent-spine
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    agents:
      - id: main
        sessionId: main
        provider: mock
        model: mock
        cwd: !!js process.cwd()
    persona: 'This keyless composition test must not start a model turn.'
    workspaceContext: false
    toolBash: false

- id: engineering-review
  name: '@deepseek-ai/dsh-engineering-review'
  config:
    automatic: false
    riskThreshold: high
    maxCorrectionPasses: 2
    maxDiffBytes: 524288
    maxFiles: 100
    checkTimeoutMs: 120000
    subagentProvider: spawn

- id: engineering-review-hardware
  name: '@deepseek-ai/dsh-engineering-review-hardware'

- id: engineering-review-invariant
  name: '@deepseek-ai/dsh-engineering-review/invariant'

- id: engineering-review-hardware-invariant
  name: '@deepseek-ai/dsh-engineering-review-hardware/invariant'
