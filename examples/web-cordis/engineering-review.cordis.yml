# Opt-in patch overlay for the generic Web profile. The existing generic tool
# card renders engineering_review; this overlay adds no browser-side package.
- insert:
    - id: engineering-review
      name: '@deepseek-ai/dsh-engineering-review'
      config:
        riskThreshold: high
        maxCorrectionPasses: 2
        maxDiffBytes: 524288
        maxFiles: 100
        checkTimeoutMs: 120000
        subagentProvider: spawn
        reviewerMaxTokens: 2048
    - id: engineering-review-hardware
      name: '@deepseek-ai/dsh-engineering-review-hardware'
