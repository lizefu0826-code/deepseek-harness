# Keyless snapshot overlay for the engineering-review gate: route the headless
# profile through a scripted cli-mock adapter and mount the gate + hardware
# adapter so the model-visible correction/final-report/freeze behaviors replay
# deterministically without any model key.
- id: agent-default-model
  config:
    provider: cli-mock
    model: cli-mock

- insert:
    - id: cli-mock-llm
      name: './snapshot-fixtures/engineering-review-mock-llm.ts'
    - id: engineering-review
      name: '@deepseek-ai/dsh-engineering-review'
      config:
        riskThreshold: medium
        maxCorrectionPasses: 1
        maxDiffBytes: 524288
        maxFiles: 100
        checkTimeoutMs: 120000
        subagentProvider: spawn
        reviewerMaxTokens: 8192
    - id: engineering-review-hardware
      name: '@deepseek-ai/dsh-engineering-review-hardware'
